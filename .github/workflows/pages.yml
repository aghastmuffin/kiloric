name: Publish b-1 website
on:
  push:
    branches: [master]
    paths: ['expo-app/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: expo-app/package-lock.json
      - run: npm ci
        working-directory: expo-app
      - run: npm run check
        working-directory: expo-app
        env:
          EXPO_NO_TELEMETRY: '1'
      - name: Check deployed API supports this release
        run: |
          status=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' https://api.kiloric.co/v1/me/prefs)
          test "$status" = 401 || { echo "Deploy the B-1 server first; /v1/me/prefs returned $status instead of 401"; exit 1; }
      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true
      - run: npm run export:web
        working-directory: expo-app
        env:
          KILORIC_BASE_PATH: /app
          EXPO_NO_TELEMETRY: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
