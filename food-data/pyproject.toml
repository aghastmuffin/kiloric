[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calcount-fooddb"
version = "1.0.0"
description = "Builds CalCount's food database from USDA FoodData Central, the Canadian Nutrient File and Open Food Facts (US/Canada)."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
calcount-fooddb = "fooddb.__main__:main"

[tool.setuptools.packages.find]
include = ["fooddb*"]
